<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff6ea">
<title>ことばだま</title>
<style>
:root{--bg:#fff6ea;--ink:#2b2d42;--mute:#7a7f95;--card:#fff;--line:#f0e3d2;--or:#ff8a4c;--pk:#ff6f91;--bl:#4c6ef5;--gr:#22b07d;--yl:#ffd43b;
--jp:"UD デジタル 教科書体 NK-R","UD Digi Kyokasho NK-R","UD Digi Kyokasho N-R","Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--yl);outline-offset:2px}
#app{max-width:760px;margin:0 auto;padding:10px 14px 110px}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 8px}
.logo{font-size:26px;font-weight:900;letter-spacing:.04em}
.logo small{display:block;font-size:12px;color:var(--mute);font-weight:700;letter-spacing:0}
.gear{font-size:28px;width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:0 3px 0 var(--line)}
.lvtag{font-size:13px;background:#fff;border-radius:99px;padding:6px 12px;font-weight:800;box-shadow:0 3px 0 var(--line);margin-right:8px}
/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;justify-content:center;box-shadow:0 -4px 20px #0000000d;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabs button{flex:1;max-width:190px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:18px;font-weight:900;font-size:15px;color:var(--mute);position:relative}
.tabs button span{font-size:30px;line-height:1.1}
.tabs button.on{color:var(--ink);background:#fff1e3}
.badge{position:absolute;top:2px;right:22%;background:var(--pk);color:#fff;border-radius:99px;font-size:12px;min-width:22px;padding:1px 6px}
/* common */
.big{display:block;width:100%;border-radius:22px;padding:18px;font-size:24px;font-weight:900;margin:12px 0;box-shadow:0 6px 0 #0000001a;transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #0000001a}
.go{background:var(--or);color:#fff}
.sub{background:#fff;color:var(--ink);border:3px solid var(--line)}
.blue{background:var(--bl);color:#fff}
h2{font-size:24px;margin:10px 0}
h3{font-size:18px;margin:18px 0 8px}
.mute{color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:#fff;border-radius:99px;padding:10px 16px;font-weight:900;font-size:17px;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.seg{display:flex;background:#fff;border-radius:18px;padding:5px;gap:4px;box-shadow:0 3px 0 var(--line);margin:4px 0 12px}
.seg button{flex:1;border-radius:14px;padding:12px 4px;font-weight:900;font-size:18px}
.seg button.on{background:var(--or);color:#fff}
ruby rt{font-size:.45em;color:var(--mute);font-weight:700}
/* home */
.ballwrap{background:radial-gradient(circle at 50% 40%,#fff 0,#fff3e2 60%,#ffe6cf 100%);border-radius:30px;position:relative;overflow:hidden;box-shadow:inset 0 -18px 0 #f6d9bb}
canvas.ball{display:block;width:100%;height:320px;touch-action:manipulation;cursor:pointer}
canvas.ball.mini{width:74px;height:74px;cursor:default}
.count{text-align:center;font-size:22px;font-weight:900;margin-top:12px}
.count b{font-size:52px;color:var(--pk);vertical-align:-4px;margin-right:4px}
.size{text-align:center;font-size:18px;font-weight:800}
.goal{margin:10px auto 0;max-width:420px;text-align:center;font-weight:800;color:var(--mute)}
.bar{height:16px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 3px var(--line);overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yl),var(--or));border-radius:99px;transition:width .5s}
.stickers{display:flex;flex-wrap:wrap;gap:8px}
.stk{background:#fff;border-radius:16px;padding:8px 12px;font-weight:900;font-size:18px;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;gap:6px}
.stk .e{font-size:24px}
/* dictionary */
.search{width:100%;border:3px solid var(--line);border-radius:18px;padding:14px 16px;font-size:20px;background:#fff;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.wc{background:#fff;border-radius:20px;padding:12px 8px;text-align:center;box-shadow:0 4px 0 var(--line);position:relative;min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.wc .e{font-size:40px;line-height:1.2}
.wc .w{font-size:22px;font-weight:900;line-height:1.4}
.wc small{font-size:12px;color:var(--mute);line-height:1.2}
.wc.got{box-shadow:0 4px 0 #ffc94d,inset 0 0 0 3px #ffd95e}
.wc.got::after{content:"⭐";position:absolute;top:6px;right:8px;font-size:16px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.kc{background:#fff;border-radius:16px;aspect-ratio:1;font-size:40px;font-weight:700;box-shadow:0 4px 0 var(--line);position:relative}
.kc.got{box-shadow:0 4px 0 #ffc94d,inset 0 0 0 3px #ffd95e}
.kana{font-size:30px}
.kc small{position:absolute;bottom:3px;left:0;right:0;font-size:11px;color:var(--mute);font-family:system-ui}
.empty{text-align:center;padding:30px;background:#fff;border-radius:22px;font-size:20px;font-weight:800}
/* modal */
.modal{position:fixed;inset:0;background:#2b2d4299;display:flex;align-items:flex-end;justify-content:center;z-index:40;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:30px 30px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));position:relative;animation:up .22s}
.x{position:absolute;right:14px;top:12px;width:48px;height:48px;border-radius:50%;background:#fff;font-size:22px;font-weight:900;box-shadow:0 3px 0 var(--line)}
.hero-e{text-align:center;font-size:96px;line-height:1.1}
.hero-w{text-align:center;font-size:48px;font-weight:900;line-height:1.5}
.hero-k{text-align:center;font-size:120px;line-height:1.1;font-weight:700}
.yomi{text-align:center;font-size:22px;color:var(--mute);font-weight:800}
.en{text-align:center;font-size:20px;background:#fff;border-radius:14px;padding:8px;margin:10px auto;max-width:420px}
.note{text-align:center;font-weight:800;margin:6px 0}
.rd{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;background:#fff;border-radius:18px;padding:14px 18px;font-size:20px;margin:12px 0}
.rd b{color:var(--mute);font-size:16px}
.pad{display:block;margin:6px auto;width:260px;height:260px;border-radius:20px;background:#fff;box-shadow:0 4px 0 var(--line);touch-action:none}
.row{display:flex;gap:10px}.row>*{flex:1}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.4}}
/* quiz */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:#fff;border-radius:22px;padding:16px 8px;font-size:19px;font-weight:900;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:4px}
.mode span{font-size:40px}
.mode.on{background:var(--ink);color:#fff;box-shadow:none}
.mode:disabled{opacity:.4}
select.theme{width:100%;border:3px solid var(--line);border-radius:18px;padding:14px;font-size:19px;font-weight:800;background:#fff}
.qtop{display:flex;align-items:center;gap:10px}
.dots{flex:1;display:flex;gap:6px}
.dots i{flex:1;height:14px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 3px var(--line)}
.dots i.ok{background:var(--gr);box-shadow:none}.dots i.ng{background:#ffb3c1;box-shadow:none}.dots i.now{background:var(--yl);box-shadow:none}
.minic{display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:14px}
.prompt{background:#fff;border-radius:28px;margin:12px 0;padding:18px;text-align:center;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--line)}
.qe{font-size:96px;line-height:1.15}
.qk{font-size:100px;font-weight:700;line-height:1.2}
.qen{font-size:22px;font-weight:800;margin-top:6px;color:var(--bl)}
.qt{font-size:22px;font-weight:900;margin-top:8px}
.speaker{font-size:70px;width:130px;height:130px;border-radius:50%;background:var(--bl);box-shadow:0 7px 0 #3450c9}
.speaker:active{transform:translateY(4px);box-shadow:0 3px 0 #3450c9}
.choices{display:grid;gap:10px}
.ch{background:#fff;border-radius:22px;padding:16px;font-size:30px;font-weight:900;box-shadow:0 5px 0 var(--line);min-height:78px;line-height:1.35}
.ch.ok{background:#d3f9e6;box-shadow:0 5px 0 var(--gr)}
.ch.ng{background:#ffe0e6;box-shadow:0 5px 0 var(--pk)}
.ch:disabled{cursor:default}
.fb{text-align:center;font-size:24px;font-weight:900;min-height:40px;margin:12px 0 4px}
.fb small{display:block;font-size:17px;color:var(--mute)}
.flyer{position:fixed;z-index:60;font-size:54px;margin:-30px 0 0 -30px;pointer-events:none;transition:transform .65s cubic-bezier(.45,-0.35,.6,1),opacity .65s;font-weight:900}
.confetti{position:fixed;z-index:59;pointer-events:none;font-size:26px;transition:transform 1s ease-out,opacity 1s}
/* settings */
.lv{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:14px 16px;margin:10px 0;box-shadow:0 4px 0 var(--line);width:100%;text-align:left}
.lv span{font-size:40px}.lv b{font-size:21px;display:block}.lv small{color:var(--mute);font-size:14px}
.lv.on{box-shadow:0 0 0 4px var(--or)}
.toggle{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:18px;padding:14px 16px;font-weight:900;font-size:18px;margin:10px 0}
.sw{width:64px;height:36px;border-radius:99px;background:#ddd;position:relative}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--gr)}.sw.on::after{left:32px}
.fine{font-size:12px;color:var(--mute);line-height:1.6;margin-top:18px}
@media (max-width:420px){.hero-w{font-size:40px}.ch{font-size:26px}canvas.ball{height:280px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo">🌈 ことばだま<small>あつめて ころがそう</small></div>
    <div><button class="lvtag" id="lvtag" data-open="settings"></button><button class="gear" data-open="settings" aria-label="せってい">⚙️</button></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs">
  <button data-tab="home"><span>🌈</span>ボール</button>
  <button data-tab="dict"><span>📖</span>じしょ</button>
  <button data-tab="quiz"><span>🎮</span>クイズ</button>
  <button data-tab="review"><span>🔁</span>ふくしゅう<b class="badge" id="badge" hidden></b></button>
</nav>
<div id="layer"></div>

let AC=null;function ding(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;(ok?[660,880,1320]:[330,247]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=t0+i*.09;o.type=ok?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.3)})}catch(e){}}

/* ---------- the ball (katamari) ---------- */
const MILES=[[0,'🔵','ビーだま'],[5,'🍡','おだんご'],[15,'🍎','りんご'],[30,'⚽','ボール'],[60,'🐶','いぬ'],[100,'🧒','こども'],[160,'🚗','くるま'],[250,'🏠','おうち'],[400,'🌳','おおきな き'],[600,'🏢','ビル'],[800,'⛰️','やま'],[1100,'🌍','ちきゅう']];
function stage(n){let i=0;while(i+1<MILES.length&&n>=MILES[i+1][0])i++;return {cur:MILES[i],next:MILES[i+1]||null}}
function h01(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}h^=h>>>13;h=Math.imul(h,0x5bd1e995);h^=h>>>15;return (h>>>0)/4294967296}
const POS=new Map();function pos(k){if(!POS.has(k))POS.set(k,[h01(k)*Math.PI*2,Math.asin(h01(k+'#')*2-1)]);return POS.get(k)}
let ROT=0,SPD=.006,BUMP=0,NEWKEY=null,NEWT=0;
function drawBall(cv){
 const dpr=Math.min(2,window.devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
 if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
 const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
 const mini=cv.classList.contains('mini'),keys=[...GOT],n=keys.length;
 const maxR=Math.min(W,H)*(mini?.36:.34);
 const R=maxR*Math.min(1,.3+.7*Math.sqrt(n/220))*(1+BUMP*.14);
 const cx=W/2,cy=mini?H/2:H*.5;
 if(!mini){ // speed lines + ground shadow
  x.strokeStyle='rgba(255,160,90,.35)';x.lineCap='round';x.lineWidth=5;
  for(let i=0;i<5;i++){const yy=cy-R*.6+i*R*.3,off=((ROT*900+i*97)%(W*.5));x.beginPath();x.moveTo(cx-R-30-off,yy);x.lineTo(cx-R-60-off,yy);x.stroke()}
  x.fillStyle='rgba(120,60,20,.13)';x.beginPath();x.ellipse(cx,cy+R*1.12,R*1.05,R*.16,0,0,Math.PI*2);x.fill()}
 const g=x.createRadialGradient(cx-R*.35,cy-R*.4,R*.08,cx,cy,R);g.addColorStop(0,'#fff6b0');g.addColorStop(.45,'#ffb35c');g.addColorStop(1,'#ff5f8a');
 x.fillStyle=g;x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.fill();
 // stripes to show rolling
 x.save();x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.clip();x.strokeStyle='rgba(255,255,255,.28)';x.lineWidth=R*.12;
 for(let i=0;i<3;i++){const a=ROT*1.3+i*2.1;const sx=Math.sin(a);if(Math.cos(a)<0)continue;x.beginPath();x.ellipse(cx+sx*R,cy,Math.abs(Math.cos(a))*R*.25+2,R,0,0,Math.PI*2);x.stroke()}x.restore();
 // items
 const FF=getComputedStyle(document.body).fontFamily;const fs=Math.max(R*.15,R*.62/Math.sqrt(1+n/5));
 const pts=[];for(const k of keys){const [a,b]=pos(k),aa=a+ROT;const z=Math.cos(b)*Math.cos(aa);if(z<-.18)continue;pts.push({k,px:Math.cos(b)*Math.sin(aa),py:Math.sin(b),z})}
 pts.sort((p,q)=>p.z-q.z);
 x.textAlign='center';x.textBaseline='middle';
 for(const p of pts){const s=fs*(.6+.4*Math.max(0,p.z))*(p.k===NEWKEY?1+.6*Math.max(0,1-(performance.now()-NEWT)/900):1);
  x.save();x.translate(cx+p.px*R*1.02,cy+p.py*R*1.02);x.rotate(Math.atan2(p.py,p.px)*.4+Math.sin(h01(p.k)*9)*.3);
  x.globalAlpha=p.z<0?Math.max(0,1+p.z*5):1;
  const it=keyItem(p.k);
  if(p.k[0]==='k'){x.fillStyle='#fff';x.strokeStyle='#4c6ef5';x.lineWidth=Math.max(1,s*.07);rr(x,-s*.45,-s*.45,s*.9,s*.9,s*.18);x.fill();x.stroke();x.fillStyle='#2b2d42';x.font=`700 ${s*.66}px ${FF}`;x.fillText(p.k.slice(2),0,s*.03)}
  else if(it&&it.emo){x.font=`${s}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;x.fillText(it.emo,0,0)}
  else{const t=it?plain(it):'?';const fz=s*.36;x.font=`900 ${fz}px ${FF}`;const tw=x.measureText(t).width+fz*.8;x.fillStyle='#fff';x.strokeStyle='#ff8a4c';x.lineWidth=Math.max(1,fz*.12);rr(x,-tw/2,-fz*.75,tw,fz*1.5,fz*.5);x.fill();x.stroke();x.fillStyle='#2b2d42';x.fillText(t,0,fz*.05)}
  x.restore()}
 if(!n&&!mini){x.fillStyle='rgba(255,255,255,.9)';x.font=`900 ${R*.28}px sans-serif`;x.fillText('?',cx,cy)}
}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function loop(){ROT+=SPD;SPD+=(.006-SPD)*.025;BUMP*=.9;document.querySelectorAll('canvas.ball').forEach(drawBall);requestAnimationFrame(loop)}
function flyTo(fromEl,text){const cv=document.querySelector('canvas.ball');if(!cv||!fromEl)return;const a=fromEl.getBoundingClientRect(),b=cv.getBoundingClientRect();

 requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transform=`translate(${b.left+b.width/2-sx}px,${b.top+b.height/2-sy}px) scale(.25) rotate(540deg)`;f.style.opacity='.3'}));

function nextKanji(n){const pool=KANJI.filter(k=>k.g<=Math.max(1,P.level||1));const due=shuffle(pool.filter(k=>isDue('k:'+k.c)));const fresh=pool.filter(k=>!P.cards['k:'+k.c]).slice(0,12);
 return [...new Set([...due.slice(0,2),...shuffle(fresh),...shuffle(pool)])].slice(0,n)}
function qtype(mode,w){const canRead=P.level>=1&&HAN.test(w.w)&&kanjiOK(w.w),canPic=!!w.emo||showEn();
 if(mode==='pic')return canPic?'pic':'listen';if(mode==='listen')return 'listen';
 const o=['listen'];if(canPic)o.push('pic','pic');if(canRead)o.push('read','read');return o[Math.random()*o.length|0]}
function startQuiz(mode,theme,keys){const N=6;let list;
 if(keys){list=shuffle(keys).slice(0,8).map(k=>{const it=keyItem(k);return k[0]==='k'?{kind:'kanji',it}:{kind:'word',it,qt:qtype('mix',it)}})}
 else if(mode==='kana')list=shuffle(KANA.filter(k=>k.t===(P.level===0&&Math.random()<.5?'h':Math.random()<.5?'h':'k'))).slice(0,N).map(it=>({kind:'kana',it}));
 else if(mode==='kanji')list=nextKanji(N).map(it=>({kind:'kanji',it}));
 else{const pool=theme>=0?THEMES[theme].words:WORDS;list=nextWords(pool,N).map(it=>({kind:'word',it,qt:qtype(mode,it)}));
  if(mode==='mix'&&P.level>=1&&theme<0){list[N-1]={kind:'kanji',it:nextKanji(1)[0]};list=shuffle(list)}}
 UI.q={list,i:0,res:[],fresh:[],mode,theme,keys:!!keys};UI.tab='play';render()}
function distract(pool,correct,keyf,n=2){const seen=new Set([keyf(correct)]);const out=[];for(const o of shuffle(pool)){const k=keyf(o);if(!seen.has(k)){seen.add(k);out.push(o)}if(out.length>=n)break}return out}
function showQ(){const Q=UI.q;if(!Q){UI.tab='quiz';return render()}if(Q.i>=Q.list.length)return endQ();
 const x=Q.list[Q.i];Q.lock=false;let prompt='',opts=[];
 if(x.kind==='word'){const w=x.it;const same=THEMES[w.t].words.length>6?THEMES[w.t].words:WORDS;
  const others=distract(same.filter(o=>o.r!==w.r&&plain(o)!==plain(w)),w,o=>x.qt==='read'?o.r:plain(o));
  if(x.qt==='read'){prompt=`<div class="qk">${esc(w.w)}</div><div class="qt">よみかたは どれ？</div>`;opts=shuffle([w,...others]).map(o=>({ok:o===w,html:esc(o.r)}))}
  else{prompt=x.qt==='pic'?`<div class="qe">${w.emo||'❓'}</div>${(showEn()||!w.emo)?`<div class="qen">${esc(w.en)}</div>`:''}<div class="qt">どの ことば？</div>`
   :`<button class="speaker" data-sayq aria-label="もういちど きく">🔊</button><div class="qt">きこえた ことばは どれ？</div>`;
   opts=shuffle([w,...others]).map(o=>({ok:o===w,html:x.qt==='pic'?disp(o):esc(plain(o))}))}}
 else if(x.kind==='kanji'){const k=x.it;const others=distract(KANJI.filter(o=>o.g===k.g),k,kread);
  prompt=`<div class="qk">${esc(k.c)}</div>${showEn()?`<div class="qen">${esc(k.en)}</div>`:''}<div class="qt">よみかたは どれ？</div>`;opts=shuffle([k,...others]).map(o=>({ok:o===k,html:esc(kread(o))}))}
 else{const k=x.it;const snd=c=>({'ぢ':'じ','づ':'ず','を':'お','ヂ':'ジ','ヅ':'ズ','ヲ':'オ'}[c]||c);
  const others=distract(KANA.filter(o=>o.t===k.t&&o.grp===k.grp),k,o=>snd(o.c));
  prompt=`<button class="speaker" data-sayq aria-label="もういちど きく">🔊</button><div class="qt">この おとの もじは？</div>`;opts=shuffle([k,...others]).map(o=>({ok:o===k,html:esc(o.c)}))}
 Q.opts=opts;
 main.innerHTML=`<div class="qtop"><div class="dots">${Q.list.map((_,i)=>`<i class="${i<Q.i?(Q.res[i]?'ok':'ng'):i===Q.i?'now':''}"></i>`).join('')}</div>
 <div class="minic"><canvas class="ball mini"></canvas>${GOT.size}こ</div></div>
 <div class="prompt">${prompt}</div>
 <div class="choices">${opts.map((o,i)=>`<button class="ch" data-ans="${i}">${o.html}</button>`).join('')}</div>
 <div class="fb" id="fb" aria-live="polite"></div><div id="nextwrap"></div>`;
 if(x.kind==='kana'||x.qt==='listen')setTimeout(()=>{if(UI.q===Q&&!Q.lock)speak(x.kind==='kana'?x.it.c:x.it.r)},300);
}
function answer(i,btn){const Q=UI.q;if(!Q||Q.lock)return;Q.lock=true;const x=Q.list[Q.i],ok=Q.opts[i].ok;Q.res[Q.i]=ok;
 const key=x.kind==='word'?'w:'+x.it.w:x.kind==='kanji'?'k:'+x.it.c:'a:'+x.it.c;const fresh=mark(key,ok);
 document.querySelectorAll('.ch').forEach((b,j)=>{b.disabled=true;if(Q.opts[j].ok)b.classList.add('ok');else if(j===i)b.classList.add('ng')});
 ding(ok);
 const ans=x.kind==='word'?`${x.it.emo||''} ${disp(x.it)}`:x.kind==='kanji'?`${esc(x.it.c)}（${esc(kread(x.it))}）`:esc(x.it.c);
 const extra=x.kind==='word'&&showEn()?`<small>${esc(x.it.en)}</small>`:'';
 if(ok){$('#fb').innerHTML=(fresh?'やったね！ ボールに くっついた！':['やったね！','すごい！','せいかい！','いいね！'][Math.random()*4|0])+extra;
  if(fresh){Q.fresh.push(key);NEWKEY=key;flyTo(btn,vis(key))}else SPD=.04;
  setTimeout(()=>{if(UI.q===Q&&UI.tab==='play'){Q.i++;showQ()}},fresh?1500:1100)}
 else{$('#fb').innerHTML=`おしい！ こたえは ${ans}${extra}`;$('#nextwrap').innerHTML=`<button class="big go" data-next>つぎへ ▶</button>`}
 speak(x.kind==='word'?x.it.r:x.kind==='kanji'?say(kread(x.it)):x.it.c)}
function endQ(){const Q=UI.q,ok=Q.res.filter(Boolean).length,n=Q.list.length;
 if(ok===n)setTimeout(confetti,200);
 main.innerHTML=`<h2 style="text-align:center;font-size:30px">${ok===n?'🏆 ぜんぶ せいかい！':`${n}もん中 ${ok}もん せいかい！`}</h2>
 <div class="ballwrap"><canvas class="ball"></canvas></div>
 <div class="count"><b>+${Q.fresh.length}</b>こ くっついた！</div>
 ${Q.fresh.length?`<div class="stickers" style="justify-content:center;margin:10px 0">${Q.fresh.map(stk).join('')}</div>`:''}
 ${ok<n?`<p class="mute" style="text-align:center">まちがえた ことばは「ふくしゅう」に はいったよ</p>`:''}
 <button class="big go" data-again>🔁 もういちど</button><button class="big sub" data-tab="home">🌈 ボールを みる</button>`;
 UI.q=null;const d=dueKeys().length,bd=$('#badge');bd.hidden=!d;bd.textContent=d}
function review(){const keys=dueKeys();const weak=Object.entries(P.cards).filter(([k,c])=>k[0]!=='a'&&c.ng>c.ok&&keyItem(k)).map(([k])=>k).slice(0,20);
 main.innerHTML=`<div class="ballwrap" style="margin-bottom:8px"><canvas class="ball" style="height:170px"></canvas></div>
 ${keys.length?`<h2 style="text-align:center">🔁 きょうの ふくしゅう： ${keys.length}こ</h2><p class="mute" style="text-align:center">わすれかけた ころに もういちど。 あたまに しっかり のこるよ！</p><button class="big go" data-review>▶ ふくしゅう スタート</button>`
  :`<div class="empty">🎉 きょうの ふくしゅうは おしまい！<br><span class="mute" style="font-size:16px">あたらしい ことばを あつめに いこう</span></div><button class="big go" data-tab="quiz">🎮 クイズへ</button>`}
 ${weak.length?`<h3>😤 にがてな ことば</h3><div class="stickers">${weak.map(stk).join('')}</div>`:''}`}
function settings(first){
 modal(`<h2>${first?'👋 ようこそ！ だれが つかう？':'⚙️ せってい'}</h2>
 ${LEVELS.map((l,i)=>`<button class="lv ${P.level===i?'on':''}" data-level="${i}"><span>${l.e}</span><div><b>${l.n}</b><small>${l.d}</small></div></button>`).join('')}
 <div class="toggle">🇬🇧 English ヒント<button class="sw ${P.hint?'on':''}" data-hint aria-label="English hint"></button></div>
 ${first?'':`<button class="big sub" data-reset>🗑️ きろくを ぜんぶ けす</button>
 <div class="fine">ことば ${WORDS.length}こ（${THEMES.length}テーマ）／ かんじ ${KANJI.length}こ（1ねん ${G1.size}・2ねん ${KANJI.length-G1.size}：がくねんべつ かんじ はいとうひょう）／ かな ${KANA.length}こ。<br>ふくしゅうは せいかい ごとに 1・3・7・14・30にち あとに でてきます。きろくは この たんまつの ブラウザーだけに ほぞんされます。こえは たんまつの よみあげきのうを つかいます。</div>`}`)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if('close' in d)return closeModal();
 if(d.tab){closeModal();if(UI.tab==='play'&&d.tab!=='play')UI.q=null;UI.tab=d.tab;render();scrollTo(0,0);return}
 if(d.open==='settings')return settings(false);
 if(d.say!==undefined)return speak(d.say);
 if('sayq' in d){const x=UI.q&&UI.q.list[UI.q.i];if(x)speak(x.kind==='kana'?x.it.c:x.it.r);return}
 if(d.dict){UI.dict=d.dict;return dict()}
 if(d.theme){UI.theme=+d.theme;dict();return}
 if(d.word)return openWord(WORDS[+d.word]);
 if(d.kanji)return openKanji(KMAP.get(d.kanji));
 if(d.kana)return speak(d.kana);
 if(d.kg){UI.kg=+d.kg;return dict()}
 if(d.kt){UI.kt=d.kt;return dict()}
 if(d.quiztheme)return startQuiz('mix',+d.quiztheme);
 if(d.kquiz)return startQuiz('kanji',-1);
 if(d.kanaquiz)return startQuiz('kana',-1);
 if(d.mode){UI.mode=d.mode;return quizMenu()}
 if('start' in d)return startQuiz(UI.mode,UI.qtheme);
 if(d.ans!==undefined)return answer(+d.ans,b);
 if('next' in d){UI.q.i++;return showQ()}
 if('again' in d)return UI.tab='quiz',startQuiz(UI.mode,UI.qtheme);
 if('review' in d)return startQuiz('mix',-1,dueKeys());
 if(d.level!==undefined){P.level=+d.level;save();closeModal();render();return}
 if('hint' in d){P.hint=!P.hint;save();b.classList.toggle('on',P.hint);render();return}
 if('reset' in d){if(confirm('きろくを ぜんぶ けしますか？')){P.cards={};GOT.clear();save();closeModal();render()}return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();loop();
if(P.level==null)settings(true);
</script>
