<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff6ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ことばだま">
<title>ことばだま</title>
<style>
:root{--bg:#fff6ea;--ink:#2b2d42;--mute:#7a7f95;--line:#f0e3d2;--or:#ff8a4c;--pk:#ff6f91;--bl:#4c6ef5;--gr:#22b07d;--yl:#ffd43b;
--jp:"UD デジタル 教科書体 NK-R","UD Digi Kyokasho NK-R","UD Digi Kyokasho N-R","Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:none}
input{-webkit-user-select:text;user-select:text}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-appearance:none;appearance:none}
canvas{touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--yl);outline-offset:2px}
#app{max-width:760px;margin:0 auto;padding:10px 14px 120px;padding-top:max(10px,env(safe-area-inset-top))}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 8px}
.logo{font-size:26px;font-weight:900;letter-spacing:.04em}
.logo small{display:block;font-size:12px;color:var(--mute);font-weight:700;letter-spacing:0}
.gear{font-size:28px;width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:0 3px 0 var(--line)}
.lvtag{font-size:13px;background:#fff;border-radius:99px;padding:6px 12px;font-weight:800;box-shadow:0 3px 0 var(--line);margin-right:8px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;justify-content:center;box-shadow:0 -4px 20px rgba(0,0,0,.05);padding:6px;padding-bottom:max(6px,env(safe-area-inset-bottom));z-index:20}
.tabs button{flex:1;max-width:190px;display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:18px;font-weight:900;font-size:15px;color:var(--mute);position:relative}
.tabs button span{font-size:30px;line-height:1.1}
.tabs button.on{color:var(--ink);background:#fff1e3}
.badge{position:absolute;top:2px;right:22%;background:var(--pk);color:#fff;border-radius:99px;font-size:12px;min-width:22px;padding:1px 6px}
.big{display:block;width:100%;border-radius:22px;padding:18px;font-size:24px;font-weight:900;margin:12px 0;box-shadow:0 6px 0 rgba(0,0,0,.1)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.1)}
.go{background:var(--or);color:#fff}
.sub{background:#fff;color:var(--ink);border:3px solid var(--line)}
.blue{background:var(--bl);color:#fff}
h2{font-size:24px;margin:10px 0}
h3{font-size:18px;margin:18px 0 8px}
.mute{color:var(--mute)}
.chips{display:flex;overflow-x:auto;padding:4px 2px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:#fff;border-radius:99px;padding:10px 16px;font-weight:900;font-size:17px;box-shadow:0 3px 0 var(--line);white-space:nowrap;margin-right:8px}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.seg{display:flex;background:#fff;border-radius:18px;padding:5px;box-shadow:0 3px 0 var(--line);margin:4px 0 12px}
.seg button{flex:1;border-radius:14px;padding:12px 4px;font-weight:900;font-size:18px;margin:0 2px}
.seg button.on{background:var(--or);color:#fff}
ruby rt{font-size:.45em;color:var(--mute);font-weight:700}
.ballwrap{border-radius:30px;position:relative;overflow:hidden;background:#fde3c3;box-shadow:0 6px 0 rgba(0,0,0,.08)}
canvas.ball{display:block;width:100%;height:340px;cursor:pointer}
canvas.ball.mini{width:74px;height:74px;cursor:default}
.place{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.9);border-radius:99px;padding:6px 14px;font-weight:900;font-size:17px;pointer-events:none}
.count{text-align:center;font-size:22px;font-weight:900;margin-top:12px}
.count b{font-size:52px;color:var(--pk);vertical-align:-4px;margin-right:4px}
.size{text-align:center;font-size:18px;font-weight:800}
.goal{margin:10px auto 0;max-width:440px;text-align:center;font-weight:800;color:var(--mute)}
.bar{height:16px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 3px var(--line);overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yl),var(--or));border-radius:99px}
.road{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px 2px 12px;scrollbar-width:none}
.road::-webkit-scrollbar{display:none}
.rs{flex:0 0 auto;width:84px;margin-right:6px;background:#fff;border-radius:18px;padding:8px 4px;text-align:center;box-shadow:0 3px 0 var(--line);font-weight:900;font-size:12px;line-height:1.3;position:relative}
.rs span{display:block;font-size:32px}
.rs.now{box-shadow:0 0 0 4px var(--or)}
.rs.lock{background:#eee;color:#aaa}
.rs.lock span{filter:grayscale(1);opacity:.5}
.stickers{display:flex;flex-wrap:wrap;margin:-4px}
.stk{background:#fff;border-radius:16px;padding:8px 12px;font-weight:900;font-size:18px;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;margin:4px}
.stk .e{font-size:24px;margin-right:6px}
.search{width:100%;border:3px solid var(--line);border-radius:18px;padding:14px 16px;font-size:20px;background:#fff;margin-bottom:8px;-webkit-appearance:none;appearance:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));grid-gap:10px;gap:10px}
.wc{background:#fff;border-radius:20px;padding:12px 8px;text-align:center;box-shadow:0 4px 0 var(--line);position:relative;min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.wc .e{font-size:40px;line-height:1.2}
.wc .w{font-size:22px;font-weight:900;line-height:1.4}
.wc small{font-size:12px;color:var(--mute);line-height:1.2}
.wc.got{box-shadow:0 4px 0 #ffc94d,inset 0 0 0 3px #ffd95e}
.wc.got::after{content:"⭐";position:absolute;top:6px;right:8px;font-size:16px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));grid-gap:8px;gap:8px}
.kc{background:#fff;border-radius:16px;height:74px;font-size:40px;font-weight:700;box-shadow:0 4px 0 var(--line);position:relative}
.kc.got{box-shadow:0 4px 0 #ffc94d,inset 0 0 0 3px #ffd95e}
.kana{font-size:30px}
.kc small{position:absolute;bottom:3px;left:0;right:0;font-size:11px;color:var(--mute);font-family:system-ui,sans-serif}
.empty{text-align:center;padding:30px;background:#fff;border-radius:22px;font-size:20px;font-weight:800}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(43,45,66,.6);display:flex;align-items:flex-end;justify-content:center;z-index:40;cursor:pointer}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:30px 30px 0 0;padding:20px 20px 24px;padding-bottom:max(24px,env(safe-area-inset-bottom));position:relative;cursor:default}
.x{position:absolute;right:14px;top:12px;width:48px;height:48px;border-radius:50%;background:#fff;font-size:22px;font-weight:900;box-shadow:0 3px 0 var(--line)}
.hero-e{text-align:center;font-size:96px;line-height:1.1}
.hero-w{text-align:center;font-size:48px;font-weight:900;line-height:1.5}
.hero-k{text-align:center;font-size:120px;line-height:1.1;font-weight:700}
.yomi{text-align:center;font-size:22px;color:var(--mute);font-weight:800}
.en{text-align:center;font-size:20px;background:#fff;border-radius:14px;padding:8px;margin:10px auto;max-width:420px}
.note{text-align:center;font-weight:800;margin:6px 0}
.rd{display:grid;grid-template-columns:auto 1fr;grid-gap:6px 12px;gap:6px 12px;background:#fff;border-radius:18px;padding:14px 18px;font-size:20px;margin:12px 0}
.rd b{color:var(--mute);font-size:16px}
.pad{display:block;margin:6px auto;width:260px;height:260px;border-radius:20px;background:#fff;box-shadow:0 4px 0 var(--line);touch-action:none}
.modes{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;gap:10px}
.mode{background:#fff;border-radius:22px;padding:16px 8px;font-size:19px;font-weight:900;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center}
.mode span{font-size:40px}
.mode.on{background:var(--ink);color:#fff;box-shadow:none}
select.theme{width:100%;border:3px solid var(--line);border-radius:18px;padding:14px;font-size:19px;font-weight:800;background:#fff;-webkit-appearance:none;appearance:none}
.qtop{display:flex;align-items:center}
.dots{flex:1;display:flex;margin-right:10px}
.dots i{flex:1;height:14px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 3px var(--line);margin-right:6px}
.dots i.ok{background:var(--gr);box-shadow:none}.dots i.ng{background:#ffb3c1;box-shadow:none}.dots i.now{background:var(--yl);box-shadow:none}
.minic{display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:14px}
.prompt{background:#fff;border-radius:28px;margin:12px 0;padding:18px;text-align:center;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--line)}
.qe{font-size:96px;line-height:1.15}
.qk{font-size:100px;font-weight:700;line-height:1.2}
.qen{font-size:22px;font-weight:800;margin-top:6px;color:var(--bl)}
.qt{font-size:22px;font-weight:900;margin-top:8px}
.speaker{font-size:70px;width:130px;height:130px;border-radius:50%;background:var(--bl);box-shadow:0 7px 0 #3450c9}
.speaker:active{transform:translateY(4px);box-shadow:0 3px 0 #3450c9}
.ch{display:block;width:100%;background:#fff;border-radius:22px;padding:16px;font-size:30px;font-weight:900;box-shadow:0 5px 0 var(--line);min-height:78px;line-height:1.35;margin-bottom:10px}
.ch.ok{background:#d3f9e6;box-shadow:0 5px 0 var(--gr)}
.ch.ng{background:#ffe0e6;box-shadow:0 5px 0 var(--pk)}
.fb{text-align:center;font-size:24px;font-weight:900;min-height:40px;margin:12px 0 4px}
.fb small{display:block;font-size:17px;color:var(--mute)}
.evo{background:linear-gradient(135deg,#fff3bf,#ffd8e4);border-radius:26px;padding:16px;text-align:center;margin:12px 0;box-shadow:0 5px 0 #ffc9d6}
.evo b{display:block;font-size:34px;color:var(--pk)}
.evo p{margin:6px 0;font-size:20px;font-weight:900}
.flyer{position:fixed;z-index:60;font-size:54px;margin:-30px 0 0 -30px;pointer-events:none;-webkit-transition:-webkit-transform .65s ease-in,opacity .65s;transition:transform .65s ease-in,opacity .65s;font-weight:900}
.confetti{position:fixed;z-index:59;pointer-events:none;font-size:26px;-webkit-transition:-webkit-transform 1s ease-out,opacity 1s;transition:transform 1s ease-out,opacity 1s}
.lv{display:flex;align-items:center;background:#fff;border-radius:22px;padding:14px 16px;margin:10px 0;box-shadow:0 4px 0 var(--line);width:100%;text-align:left}
.lv span{font-size:40px;margin-right:14px}.lv b{font-size:21px;display:block}.lv small{color:var(--mute);font-size:14px}
.lv.on{box-shadow:0 0 0 4px var(--or)}
.toggle{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:18px;padding:14px 16px;font-weight:900;font-size:18px;margin:10px 0}
.sw{width:64px;height:36px;border-radius:99px;background:#ddd;position:relative}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--gr)}.sw.on::after{left:32px}
.warn{background:#ffe0e6;border-radius:16px;padding:10px 14px;font-weight:800;font-size:15px;margin-bottom:8px;text-align:center}
.fine{font-size:12px;color:var(--mute);line-height:1.6;margin-top:18px}
.coinbar{text-align:center;font-weight:900;font-size:18px;margin-top:6px}
.coinbar b{color:#f08c00;font-size:24px}
.prompt.enc{position:relative;overflow:hidden;-webkit-animation:encp 1.1s ease-in-out infinite alternate;animation:encp 1.1s ease-in-out infinite alternate}
.prompt.enc.rare{background:linear-gradient(135deg,#fff9db,#ffe8a3);box-shadow:0 0 0 4px #fcc419,0 0 30px #ffd43b}
.prompt.enc.mythic{background:linear-gradient(135deg,#fff0f6,#e5dbff);box-shadow:0 0 0 4px #d6336c,0 0 34px #f783ac}
.prompt.enc.cosmic{background:radial-gradient(circle at 30% 20%,#5f3dc4,#12002b 70%);color:#fff;box-shadow:0 0 0 4px #74c0fc,0 0 44px #9775fa}
.prompt.enc.cosmic .qt{color:#fff}
@-webkit-keyframes encp{from{-webkit-transform:scale(1)}to{-webkit-transform:scale(1.02)}}
@keyframes encp{from{transform:scale(1)}to{transform:scale(1.02)}}
.encb{font-weight:900;font-size:17px;border-radius:99px;padding:6px 14px;margin-bottom:6px;color:#fff}
.encb.rare{background:#f59f00}.encb.mythic{background:linear-gradient(90deg,#d6336c,#7048e8)}
.encb.cosmic{background:linear-gradient(90deg,#1c7ed6,#7048e8,#e64980,#1c7ed6);background-size:300% 100%;-webkit-animation:cos 3s linear infinite;animation:cos 3s linear infinite}
@-webkit-keyframes cos{to{background-position:300% 0}}@keyframes cos{to{background-position:300% 0}}
.rk{text-shadow:0 0 18px rgba(255,212,59,.9)}
.kc.rare{background:#fff9db;box-shadow:0 4px 0 #f59f00,inset 0 0 0 3px #ffd43b}
.kc.mythic{background:#fff0f6;box-shadow:0 4px 0 #d6336c,inset 0 0 0 3px #f783ac}
.kc.cosmic{background:#1a0b3a;color:#fff;box-shadow:0 4px 0 #5f3dc4,inset 0 0 0 3px #74c0fc}
.kc.lockc{display:flex;align-items:center;justify-content:center;color:#bbb;opacity:.75}
.kc.cosmic.lockc{color:#74c0fc}
.stk.rare{background:#fff3bf}.stk.mythic{background:#ffdeeb}.stk.cosmic{background:#1a0b3a;color:#fff}
.tierh{display:flex;align-items:center;justify-content:space-between}
.coinpop{display:inline-block;margin-left:6px;color:#f08c00}
body.bossmode{background:#12001f}
body.bossmode .logo,body.bossmode .logo small{color:#fff}
body.bossmode .tabs,body.bossmode .gbtn,body.bossmode .gear{display:none}
body.bossmode .ch{background:#2a1145;color:#fff;box-shadow:0 5px 0 #0d0019}
body.bossmode .ch.ok{background:#2b8a3e;box-shadow:0 5px 0 #1b5e20}
body.bossmode .ch.ng{background:#c2255c;box-shadow:0 5px 0 #7a1238}
canvas.arena{display:block;width:100%;height:320px;border-radius:24px;box-shadow:0 0 0 3px #6f2dbd,0 0 30px rgba(255,45,111,.5)}
.btimer{height:14px;border-radius:99px;background:#2a1145;overflow:hidden;margin:12px 0}
.btimer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff2d6f,#ffd43b)}
.bprompt{background:#1d0a33;color:#fff;border-radius:24px;padding:12px;text-align:center;margin-bottom:10px;box-shadow:0 0 0 2px #6f2dbd}
.bprompt .qt{color:#ffd43b}
.bfb{color:#fff;text-align:center;font-weight:900;font-size:22px;min-height:34px;margin:6px 0}
.bossbtn{background:linear-gradient(90deg,#2b1055,#c2255c);color:#fff;-webkit-animation:shake .5s infinite;animation:shake .5s infinite}
@-webkit-keyframes shake{0%,100%{-webkit-transform:translateX(0)}25%{-webkit-transform:translateX(-3px) rotate(-1deg)}75%{-webkit-transform:translateX(3px) rotate(1deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px) rotate(-1deg)}75%{transform:translateX(3px) rotate(1deg)}}
.rank{font-size:110px;font-weight:900;text-align:center;line-height:1;margin-top:8px}
.rank.S{color:#ffd43b;text-shadow:0 0 30px #ff922b}.rank.A{color:#74c0fc;text-shadow:0 0 24px #4c6ef5}.rank.B{color:#8ce99a;text-shadow:0 0 20px #22b07d}.rank.C{color:#adb5bd}
.bossres{text-align:center;color:#fff}.bossres h2{color:#fff}.bossres .mute{color:#c9b8ff}
.awning{height:30px;background:repeating-linear-gradient(90deg,#ff6f91 0 30px,#fff 30px 60px);border-radius:18px 18px 0 0;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.shopsign{background:#fff;border-radius:0 0 22px 22px;text-align:center;padding:10px;font-size:26px;font-weight:900;box-shadow:0 4px 0 var(--line);margin-bottom:12px}
.shopsign small{display:block;font-size:14px;color:var(--mute)}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-gap:10px;gap:10px}
.skin{background:#fff;border-radius:20px;padding:10px 6px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;font-weight:900}
.skin b{font-size:15px;margin-top:4px}.skin span{font-size:15px;color:#f08c00;margin-top:2px}
.skin.eq{box-shadow:0 0 0 4px var(--gr)}.skin.own span{color:var(--gr)}.skin.poor span{color:#aaa}
canvas.ball.mini.skinprev{width:110px;height:110px}
canvas.ball.mini.skinprev.big{width:220px;height:220px;margin:0 auto}
.cnt{position:absolute;right:4px;bottom:2px;font-size:12px;font-style:normal;font-weight:900;background:var(--pk);color:#fff;border-radius:99px;padding:0 6px;line-height:1.5}
.zhead{text-align:center;font-weight:800;margin:6px 0}
.codebox{font-family:ui-monospace,Menlo,monospace;font-size:40px;font-weight:900;letter-spacing:.12em;text-align:center;background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 0 0 4px var(--yl);-webkit-user-select:text;user-select:text}
.codein{text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:30px;letter-spacing:.1em;text-transform:uppercase}
.skin.lockp canvas{filter:grayscale(1) brightness(.75);-webkit-filter:grayscale(1) brightness(.75)}
.gcard{background:#fff;border-radius:22px;padding:14px;margin:10px 0;box-shadow:0 4px 0 var(--line);display:flex;align-items:center}
.gcard .ge{font-size:50px;margin-right:12px}.gcard .gi{flex:1}.gcard b{font-size:19px}
.gbtn2{padding:12px 14px;border-radius:16px;font-weight:900;font-size:17px;background:var(--or);color:#fff;white-space:nowrap;margin-left:8px}
.prz{display:flex;flex-wrap:wrap;margin-top:6px}.prz span{background:#f1f3f5;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:800;margin:2px}.prz span.ok{background:#d3f9e6}
.mghead{display:flex;justify-content:space-between;font-weight:900;font-size:20px}
.mgt{background:#fff;border-radius:22px;padding:12px;text-align:center;font-size:20px;font-weight:900;margin:10px 0;box-shadow:0 4px 0 var(--line)}.mgt b{font-size:34px;color:var(--pk)}
.holes{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:12px;gap:12px;background:linear-gradient(#8ce99a,#51cf66);padding:16px;border-radius:26px}
.hole{height:104px;border-radius:50%/42%;background:radial-gradient(ellipse at 50% 75%,#3d2410 0 50%,#7a5230 52% 100%);position:relative;overflow:hidden}
.hole span{position:absolute;left:12%;width:76%;height:78%;bottom:-85%;background:#fff;border-radius:40% 40% 12px 12px;font-size:44px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:bottom .12s;box-shadow:inset 0 -6px 0 #e9c79a}
.hole.up span{bottom:12%}.hole.hit span{background:#ffd43b}.hole.bad span{background:#ffb3c1}
.cards{display:grid;grid-template-columns:repeat(4,1fr);grid-gap:8px;gap:8px}
.card{height:92px;border-radius:16px;background:linear-gradient(135deg,#ff6f91,#ff8a4c);color:#fff;font-size:34px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.card.up{background:#fff;color:var(--ink)}.card.r{font-size:18px}.card.done{background:#d3f9e6;opacity:.75}
@media (max-width:420px){.hero-w{font-size:40px}.ch{font-size:26px}canvas.ball{height:300px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo">🌈 ことばだま<small>あつめて ころがそう</small></div>
    <div><button class="lvtag" id="lvtag" data-open="settings"></button><button class="gear" data-open="settings" aria-label="せってい">⚙️</button></div>
  </header>
  <div id="warn"></div>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs">
  <button data-tab="home"><span>🌈</span>ボール</button>

function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const today=()=>ymd(new Date());
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return ymd(d)}
const isDue=k=>!!(P.cards[k]&&P.cards[k].due<=today());
function mark(key,ok){const c=P.cards[key]||{s:0,ok:0,ng:0};c.s=ok?Math.min(5,c.s+1):0;c.due=addDays(ok?[0,1,3,7,14,30][c.s]:0);if(ok)c.ok++;else c.ng++;P.cards[key]=c;
 let fresh=false;if(ok&&key.slice(0,2)!=='a:'&&!GOT.has(key)){GOT.add(key);fresh=true;if(key[0]==='k'){G.coins++;gsave()}}save();return fresh}

const HAS_TTS=typeof window.speechSynthesis!=='undefined'&&typeof window.SpeechSynthesisUtterance!=='undefined';
let VOICE=null,LASTU=null,UNLOCKED=false,AC=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/^ja[-_]JP/i.test(v.lang)&&/Kyoko|O-ren|Otoya|Hattori/i.test(v.name))||vs.find(v=>/^ja/i.test(v.lang))||null}catch(e){}}
if(HAS_TTS){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){speechSynthesis.onvoiceschanged=pickVoice}}
function speak(t){if(!HAS_TTS||!t)return;const ss=speechSynthesis;const u=new SpeechSynthesisUtterance(say(t));u.lang='ja-JP';if(VOICE)u.voice=VOICE;u.rate=.9;u.pitch=1.1;LASTU=u;
 if(ss.speaking||ss.pending){ss.cancel();setTimeout(()=>{if(LASTU===u)ss.speak(u)},90)}else ss.speak(u);
 if(ss.paused)ss.resume()}
function getAC(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function unlock(){getAC();if(UNLOCKED)return;UNLOCKED=true;
 if(HAS_TTS){try{if(!VOICE)pickVoice();const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
 try{const a=AC,b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0)}catch(e){}}

function tone(fs,type,step,len){const a=getAC();if(!a)return;try{const t0=a.currentTime+.01;fs.forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain(),t=t0+i*step;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+len+.02)})}catch(e){}}

function blip(f,type,len,vol){const a=getAC();if(!a)return;try{const t=a.currentTime+.01,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+len+.02)}catch(e){}}
function bossMusic(on){clearInterval(BM);BM=null;if(!on)return;let i=0;const seq=[110,110,131,110,98,98,147,123];
 BM=setInterval(()=>{if(UI.tab!=='boss'||!UI.b||UI.b.phase==='done'){clearInterval(BM);BM=null;return}blip(seq[i%8],'sawtooth',.16,.03);if(i%2===0)blip(55,'square',.08,.025);i++},230)}
function startBoss(){const st=stageOf(GOT.size),[e,name]=BOSSES[st];
 let items=shuffle([...GOT].filter(k=>(k[0]==='w'||(k[0]==='k'&&P.level>=1))&&keyItem(k))).map(k=>k[0]==='k'?{kind:'kanji',it:keyItem(k)}:{kind:'word',it:keyItem(k),qt:'pic'});
 if(items.length<BQ)items=items.concat(nextWords(WORDS,BQ).filter(w=>!items.some(x=>x.it===w)).map(it=>({kind:'word',it,qt:'pic'})));
 UI.b={e,name,st,list:items.slice(0,BQ),i:0,hp:100,res:[],phase:'intro',t0:now(),anim:null,dmg:[],lock:true};
 closeModal();UI.tab='boss';render();scrollTo(0,0);bossMusic(true);tone([147,139,131,123],'sawtooth',.2,.35);
 setTimeout(()=>{if(UI.b&&UI.b.phase==='intro'){UI.b.phase='q';bossQ()}},2300)}
function showBoss(){const B=UI.b;if(!B){UI.tab='home';return render()}
 main.innerHTML=`<canvas class="arena" id="arena"></canvas><div id="bq"></div>`;
 if(B.phase==='q')bossQ();else if(B.phase==='done')bossResult();else $('#bq').innerHTML=`<div class="bfb">${B.phase==='intro'?'⚠️ ボス しゅつげん！ ⚠️':''}</div>`}
function bossQ(){const B=UI.b;if(!B||!$('#bq'))return;
 if(B.hp<=0)return bossEnd(true);
 if(B.i>=B.list.length||B.res.filter(Boolean).length+(B.list.length-B.i)<BNEED)return bossEnd(false);
 const m=makeQ(B.list[B.i]);B.opts=m.opts;B.lock=false;B.qT0=now();
 $('#bq').innerHTML=`<div class="btimer"><i id="bt"></i></div><div class="bprompt">${m.prompt.replace('font-size:110px','font-size:76px').replace(/font-size:(\d+)px/,(a,n)=>'font-size:'+Math.min(76,+n)+'px')}</div>
 <div>${m.opts.map((o,i)=>`<button class="ch" data-bans="${i}">${o.html}</button>`).join('')}</div><div class="bfb" id="bfb">${B.i+1} / ${B.list.length}</div>
 <button class="big sub" data-flee style="background:#2a1145;color:#c9b8ff;border-color:#3d1f63;font-size:18px;padding:10px">🏃 にげる</button>`}
function bossAnswer(i){const B=UI.b;if(!B||B.lock)return;B.lock=true;const x=B.list[B.i],ok=i>=0&&B.opts[i].ok;B.res.push(ok);
 const key=x.kind==='word'?'w:'+x.it.w:'k:'+x.it.c;const fresh=mark(key,ok);if(fresh&&key[0]==='k')B.coins=(B.coins||0)+1;
 document.querySelectorAll('#bq .ch').forEach((b,j)=>{b.disabled=true;if(B.opts[j].ok)b.classList.add('ok');else if(j===i)b.classList.add('ng')});
 const ans=x.kind==='word'?`${esc(plain(x.it))}`:`${esc(x.it.c)}（${esc(kread(x.it))}）`;
 if(ok){B.hp=Math.max(0,B.hp-100/BNEED);B.anim={type:'hit',t:now()};B.dmg.push({t:now()+260,v:Math.round(100/BNEED)});SPD=.12;
  setTimeout(()=>{tone([180,120],'square',.05,.15);tone([880,1320],'triangle',.06,.2)},260);$('#bfb').innerHTML=`💥 ヒット！ ${ans}`}
 else{B.anim={type:'miss',t:now()};setTimeout(()=>tone([220,165,110],'sawtooth',.08,.25),200);$('#bfb').innerHTML=`${i<0?'⏰ じかんぎれ！':'😵 ボスの こうげき！'} こたえ：${ans}`}
 speak(x.kind==='word'?x.it.r:say(kread(x.it)));
 setTimeout(()=>{if(UI.b!==B)return;B.i++;bossQ()},1500)}
function bossEnd(win){const B=UI.b;B.phase='end';B.win=win;B.anim={type:win?'win':'lose',t:now()};B.lock=true;
 $('#bq').innerHTML=`<div class="bfb" style="font-size:30px;margin-top:14px">${win?'🌀 まきこめーーっ！':'💨 ボスが にげていく…'}</div>`;
 if(win){tone([392,523,659,784,1047],'triangle',.1,.3);setTimeout(()=>{fanfare();confetti()},1900)}
 setTimeout(()=>{if(UI.b!==B)return;B.phase='done';bossMusic(false);
  const miss=B.res.filter(v=>!v).length,r=!win?'C':miss===0?'S':miss===1?'A':'B',rw={S:20,A:12,B:8,C:2}[r];
  B.rank=r;B.reward=rw+(B.coins||0);G.coins+=rw;if(win)G.trophies.push(B.e);gsave();bossResult()},win?2700:2000)}
function bossResult(){const B=UI.b;const c=B.res.filter(Boolean).length;
 $('#bq').innerHTML=`<div class="bossres"><div class="rank ${B.rank}">${B.rank}</div>
 <h2>${B.win?`${B.e} ${esc(B.name)}を まきこんだ！`:`${B.e} ${esc(B.name)}に にげられた…`}</h2>
 <p class="mute">${B.res.length}もん中 ${c}もん せいかい</p>
 <div class="coinbar" style="color:#fff">🪙 <b>+${B.reward}</b> コイン</div>
 <p class="mute" style="font-size:14px">S：ノーミス ／ A：ミス 1かい ／ B：ミス 2かい</p></div>
 <button class="big go" data-boss>${B.win?'🔥 もういちど たたかう':'🔥 リベンジ！'}</button>
 <button class="big sub" data-tab="home" style="background:#2a1145;color:#fff;border-color:#3d1f63">🌈 ボールを みる</button>
 <button class="big sub" data-tab="shop" style="background:#2a1145;color:#fff;border-color:#3d1f63">🍭 だがしやへ</button>`;
 if(B.win)speak(B.name+'を まきこんだ！');}
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
function drawArena(cv){const B=UI.b;if(!B)return;const dpr=Math.min(2,window.devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
 if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
 const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);const T=now(),t=TIME;x.textAlign='center';x.textBaseline='middle';
 let g=x.createRadialGradient(W*.7,H*.4,10,W*.6,H*.5,W);g.addColorStop(0,'#6a0f3c');g.addColorStop(.5,'#2a0845');g.addColorStop(1,'#07010f');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.save();x.translate(W*.72,H*.42);x.rotate(t*.0003);for(let i=0;i<12;i++){x.rotate(Math.PI/6);x.fillStyle=i%2?'rgba(255,60,120,.08)':'rgba(140,60,255,.08)';x.beginPath();x.moveTo(0,0);x.lineTo(W*1.2,-W*.14);x.lineTo(W*1.2,W*.14);x.fill()}x.restore();
 for(let i=0;i<14;i++){const cx=((h01('cl'+i)*W*1.4-t*.02*(1+h01('cv'+i)))%(W*1.4)+W*1.4)%(W*1.4)-W*.2;x.fillStyle='rgba(20,0,30,.45)';x.beginPath();x.ellipse(cx,H*(.08+h01('cy'+i)*.2),W*.12,H*.05,0,0,6.2832);x.fill()}
 if(!B.fl||T>B.fl+2200+h01('f'+Math.floor(B.fl))*2600)B.fl=T;const lf=(T-B.fl)/220;
 if(lf<1){x.fillStyle=`rgba(255,255,255,${.3*(1-lf)})`;x.fillRect(0,0,W,H);x.strokeStyle=`rgba(255,240,150,${1-lf})`;x.lineWidth=3;x.shadowColor='#ffd43b';x.shadowBlur=14;x.beginPath();let lx=W*(.2+h01('lx'+B.fl)*.6),ly=0;x.moveTo(lx,ly);while(ly<H*.7){ly+=H*.08;lx+=(h01('j'+ly+B.fl)-.5)*W*.08;x.lineTo(lx,ly)}x.stroke();x.shadowBlur=0}
 for(let i=0;i<40;i++){const sp2=.02+h01('es'+i)*.05,ey=H-((t*sp2+h01('ey'+i)*H)%(H+20));x.fillStyle=`rgba(255,${120+h01('ec'+i)*100|0},60,${.35+.4*Math.sin(t*.01+i)})`;x.beginPath();x.arc(h01('ex'+i)*W+Math.sin(t*.002+i)*8,ey,1+h01('er'+i)*2.5,0,6.2832);x.fill()}
 const gy=H*.84;x.fillStyle='#14051f';x.fillRect(0,gy,W,H-gy);x.strokeStyle='#ff2d6f';x.lineWidth=3;x.shadowColor='#ff2d6f';x.shadowBlur=12;x.beginPath();x.moveTo(0,gy);x.lineTo(W,gy);x.stroke();x.shadowBlur=0;
 const a=B.anim,p=a?(T-a.t)/(a.type==='win'?2400:a.type==='lose'?1800:650):2;
 const hpF=B.hp/100;let bsz=H*(.42+.2*hpF),bX=W*.72,bY=gy-bsz*.42+Math.sin(t*.003)*6,brot=Math.sin(t*.002)*.08,bA=1;
 if(B.phase==='intro'){const q=(T-B.t0)/1300;bX+=(1-ease(q))*W*.6;bsz*=.6+.4*ease(q)}
 let R=H*(.1+.035*B.res.filter(Boolean).length),cX=W*.24,cY;
 if(a&&p<1){if(a.type==='hit'){const d=Math.sin(Math.PI*Math.min(1,p));cX+=(bX-bsz*.3-R-cX)*d;if(p>.35){bX+=Math.sin(T*.09)*12*(1-p);brot+=.2*(1-p)}}
  if(a.type==='miss'){const d=Math.sin(Math.PI*p);bX-=W*.28*d;if(p>.4)cX+=Math.sin(T*.1)*8*(1-p);x.fillStyle=`rgba(255,0,60,${.28*d})`}
  if(a.type==='win'){const m=ease(p/.45);cX+=(bX-cX)*m;R*=1+1.4*ease((p-.2)/.5);const s=Math.max(0,1-(p-.35)/.45);const orb=(p-.35)*16;bsz*=s;if(p>.35){bX=cX+Math.cos(orb)*R*.9*s;bY=gy-R+Math.sin(orb)*R*.6*s;brot+=orb}if(s<=0)bA=0}
  if(a.type==='lose'){bX+=ease(p)*W*.6;cX-=0;bsz*=1+.2*Math.sin(p*20)}}
 else if(B.phase==='done'&&B.win){bA=0;R*=1.9;cX=W*.5}else if(B.phase==='done'){bA=0}
 cY=gy-R*.97;
 if(bA>0&&bsz>2){const ag=x.createRadialGradient(bX,bY,bsz*.1,bX,bY,bsz*.8);ag.addColorStop(0,'rgba(255,40,90,.45)');ag.addColorStop(1,'rgba(255,40,90,0)');x.fillStyle=ag;x.beginPath();x.arc(bX,bY,bsz*.8,0,6.2832);x.fill();
  x.save();x.translate(bX,bY);x.rotate(brot);emo(x,B.e,0,0,bsz);x.restore()}
 x.save();x.fillStyle='rgba(0,0,0,.35)';x.translate(cX,gy+2);x.scale(1,.18);x.beginPath();x.arc(0,0,R,0,6.2832);x.fill();x.restore();
 drawBallAt(x,cX,cY,R,stageOf(GOT.size),GOT.size,false);
 if(a&&a.type==='miss'&&p<1){x.fillStyle=`rgba(255,0,60,${.28*Math.sin(Math.PI*p)})`;x.fillRect(0,0,W,H)}
 if(a&&a.type==='win'&&p>.8&&p<1.2){x.fillStyle=`rgba(255,255,255,${1-Math.abs(p-1)*5})`;x.fillRect(0,0,W,H)}
 B.dmg=B.dmg.filter(d=>T-d.t<1000);B.dmg.forEach(d=>{const q=(T-d.t)/1000;if(q<0)return;x.globalAlpha=1-q;x.fillStyle='#ffd43b';x.strokeStyle='#5c0f2c';x.lineWidth=5;x.font=`900 ${H*.13}px ${FF}`;x.strokeText('-'+d.v,W*.72,H*.3-q*50);x.fillText('-'+d.v,W*.72,H*.3-q*50);x.globalAlpha=1});
 if(B.phase!=='done'){const bw=W*.42,bx0=W*.55,by0=14;x.fillStyle='rgba(0,0,0,.5)';rr(x,bx0,by0,bw,18,9);x.fill();x.fillStyle=hpF>.5?'#ff2d6f':hpF>.25?'#ff922b':'#ffd43b';if(hpF>0){rr(x,bx0,by0,Math.max(18,bw*hpF),18,9);x.fill()}
  x.fillStyle='#fff';x.font=`900 ${Math.max(13,H*.05)}px ${FF}`;x.textAlign='right';x.fillText(B.e+' '+B.name,bx0+bw,by0+34);x.textAlign='left';x.fillText('🌈 ことばだま',12,22);x.textAlign='center'}
 if(B.phase==='intro'){const q=(T-B.t0)/2300;x.globalAlpha=Math.min(1,q*4)*(.6+.4*Math.abs(Math.sin(T*.008)));x.fillStyle='#ff2d6f';x.fillRect(0,H*.4,W,H*.2);x.globalAlpha=1;x.fillStyle='#fff';x.font=`900 ${H*.11}px ${FF}`;x.fillText('⚠️ WARNING ⚠️',W/2,H*.5)}
 if(B.phase==='q'&&!B.lock){const fr=Math.max(0,1-(T-B.qT0)/BTIME),bt=document.getElementById('bt');if(bt){bt.style.width=(fr*100)+'%'}if(fr<=0)bossAnswer(-1)}}

function review(){const keys=dueKeys();const weak=Object.keys(P.cards).filter(k=>k[0]!=='a'&&P.cards[k].ng>P.cards[k].ok&&keyItem(k)).slice(0,20);
 main.innerHTML=`<div class="ballwrap" style="margin-bottom:8px"><canvas class="ball" style="height:180px"></canvas></div>
 ${keys.length?`<h2 style="text-align:center">🔁 きょうの ふくしゅう： ${keys.length}こ</h2><p class="mute" style="text-align:center">わすれかけた ころに もういちど。 あたまに しっかり のこるよ！</p><button class="big go" data-review>▶ ふくしゅう スタート</button>`
  :`<div class="empty">🎉 きょうの ふくしゅうは おしまい！<br><span class="mute" style="font-size:16px">あたらしい ことばを あつめに いこう</span></div><button class="big go" data-tab="quiz">🎮 クイズへ</button>`}
 ${weak.length?`<h3>😤 にがてな ことば</h3><div class="stickers">${weak.map(stk).join('')}</div>`:''}`}
function settings(first){
 modal(`<h2>${first?'👋 ようこそ！ だれが つかう？':'⚙️ せってい'}</h2>
 ${LEVELS.map((l,i)=>`<button class="lv ${P.level===i?'on':''}" data-level="${i}"><span>${l.e}</span><div><b>${l.n}</b><small>${l.d}</small></div></button>`).join('')}
 <div class="toggle">🇬🇧 English ヒント<button class="sw ${P.hint?'on':''}" data-hint aria-label="English hint"></button></div>
 ${first?'':`<button class="big sub" data-testvoice>🔊 こえの テスト</button><button class="big sub" data-reset>🗑️ きろくを ぜんぶ けす</button>
 <div class="fine">ことば ${WORDS.length}こ（${THEMES.length}テーマ）／ かんじ ${KANJI.length}こ（1ねん ${G1.size}・2ねん ${KANJI.length-G1.size}：がくねんべつ かんじ はいとうひょう）／ かな ${KANA.length}こ。<br>ボールは ${STAGES.map(s=>s.n+'こ').join('・')} で しんかします。<br>ふくしゅうは せいかい ごとに 1・3・7・14・30にち あとに でてきます。きろくは この たんまつの ブラウザーだけに ほぞんされます。<br>こえが でないとき：iPadの マナーモードと おとの おおきさを たしかめてね。</div>`}`)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(!b)return;const d=b.dataset;
 if('close' in d)return closeModal();
 if(d.tab){if(UI.tab==='boss'){bossMusic(false);UI.b=null}if(UI.tab==='mg'){stopMG();UI.m=null}closeModal();if(UI.tab==='play'&&d.tab!=='play')UI.q=null;UI.tab=d.tab;render();scrollTo(0,0);return}
 if(d.open==='settings')return settings(false);
 if(d.preview!==undefined)return preview(+d.preview);
 if(d.say!==undefined)return speak(d.say);
 if('sayq' in d){const x=UI.q&&UI.q.list[UI.q.i];if(x)speak(x.kind==='kana'?x.it.c:x.it.r);return}
 if(d.dict){UI.dict=d.dict;return dict()}
 if(d.theme){UI.theme=+d.theme;$('#wres').innerHTML=wordsRes();return}
 if(d.word)return openWord(WORDS[+d.word]);
 if(d.kanji)return openKanji(KMAP.get(d.kanji));
 if(d.kana)return speak(d.kana);
 if(d.kg){UI.kg=+d.kg;return dict()}
 if(d.kt){UI.kt=d.kt;return dict()}
 if(d.quiztheme)return startQuiz('mix',+d.quiztheme);
 if(d.kquiz)return startQuiz('kanji',-1);
 if(d.kanaquiz)return startQuiz('kana',-1);
 if(d.mode){UI.mode=d.mode;return quizMenu()}
 if('start' in d)return startQuiz(UI.mode,UI.qtheme);
 if(d.ans!==undefined)return answer(+d.ans,b);
 if('next' in d){UI.q.i++;showQ();scrollTo(0,0);return}
 if('again' in d)return startQuiz(UI.mode,UI.qtheme);
 if('boss' in d)return startBoss();
 if(d.bans!==undefined)return bossAnswer(+d.bans);
 if('flee' in d){bossMusic(false);UI.b=null;UI.tab='home';render();scrollTo(0,0);return}
 if(d.sk)return skinClick(d.sk);
 if(d.buyok)return buySkin(d.buyok);
 if(d.rare)return openRare(RMAP.get(d.rare));
 if('rhint' in d){const x=UI.q&&UI.q.list[UI.q.i];if(x&&x.kind==='rare'){x.hint=1;$('#rhint').textContent=x.it.e+' '+x.it.en;b.remove()}return}
 if(d.stab){closeModal();UI.shopTab=d.stab;if(UI.tab!=='shop'){UI.tab='shop';render()}else shop();return}
 if(d.mgbuy)return mgBuyAsk(d.mgbuy);
 if(d.mgbuyok)return mgBuy(d.mgbuyok);
 if(d.mgplay)return mgStart(d.mgplay);
 if('mgquit' in d){stopMG();UI.m=null;UI.tab='shop';UI.shopTab='game';render();return}
 if(d.hole!==undefined)return moleHit(+d.hole);
 if(d.card!==undefined)return memFlip(+d.card);
 if(d.sp!==undefined)return speedAns(+d.sp);
 if(d.give)return giveAsk(d.give);
 if(d.giveok)return giveRare(d.giveok);
 if('redeem' in d)return redeemAsk();
 if('redeemok' in d)return redeem();
 if(d.copy){try{navigator.clipboard.writeText(d.copy).then(()=>{b.textContent='✅ コピーした！'},()=>{b.textContent='コードを ながおしで コピーしてね'})}catch(e){b.textContent='コードを ながおしで コピーしてね'}return}
 if('review' in d)return startQuiz('mix',-1,dueKeys());
 if(d.level!==undefined){P.level=+d.level;save();closeModal();render();return}
 if('hint' in d){P.hint=!P.hint;save();b.classList.toggle('on',P.hint);render();return}
 if('testvoice' in d)return speak('こんにちは。ことばだま です。');
 if('reset' in d){if(confirm('きろくを ぜんぶ けしますか？')){P.cards={};GOT.clear();save();closeModal();render()}return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
FF=getComputedStyle(document.body).fontFamily||'sans-serif';
warn();render();requestAnimationFrame(loop);
if(P.level==null)settings(true);
</script>
